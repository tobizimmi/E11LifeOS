name: Deploy E11LifeOS

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      action:
        description: 'deploy = Code ausrollen (develop → Staging, main → Live) · server-einrichten = .env aus dem Secret ENV_FILE_… schreiben und App installieren'
        type: choice
        options:
          - deploy
          - server-einrichten
          - status
        default: deploy
      environment:
        description: 'Nur für server-einrichten / status: welcher Server?'
        type: choice
        options:
          - staging
          - live
        default: staging
      overwrite:
        description: 'Nur für server-einrichten: abweichende Werte in der .env ersetzen (APP_KEY nie)'
        type: boolean
        default: false

jobs:
  tests:
    if: inputs.action != 'server-einrichten' && inputs.action != 'status'
    uses: ./.github/workflows/tests.yml

  server-setup:
    if: inputs.action == 'server-einrichten'
    uses: ./.github/workflows/server-setup.yml
    with:
      environment: ${{ inputs.environment }}
      overwrite: ${{ inputs.overwrite }}
    secrets: inherit

  server-status:
    if: inputs.action == 'status'
    uses: ./.github/workflows/server-status.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit

  deploy:
    needs: tests
    runs-on: ubuntu-latest

    env:
      DEPLOY_ENV: ${{ github.ref == 'refs/heads/main' && 'live' || 'staging' }}
      APP_PATH_DEPLOY: ${{ github.ref == 'refs/heads/main' && secrets.APP_PATH_LIVE || secrets.APP_PATH_STAGING }}
      SSH_HOST_DEPLOY: ${{ github.ref == 'refs/heads/main' && secrets.SSH_HOST_LIVE || secrets.SSH_HOST_STAGING }}
      # PM2 process names per environment (app = php built-in server, reverb = websocket server)
      PM2_APP_NAME: ${{ github.ref == 'refs/heads/main' && 'e11lifeos-app' || 'e11lifeos-app-staging' }}
      PM2_REVERB_NAME: ${{ github.ref == 'refs/heads/main' && 'e11lifeos-reverb' || 'e11lifeos-reverb-staging' }}
      # Internal ports behind the Apache proxy (docs/deployment.md): Live 3010/3011, Staging 3020/3021.
      APP_PORT: ${{ github.ref == 'refs/heads/main' && '3010' || '3020' }}
      REVERB_PORT: ${{ github.ref == 'refs/heads/main' && '3011' || '3021' }}
      # Scheduler (schedule:work) and queue worker run as PM2 processes of the same user as the
      # app, so they can write to storage/ (a Plesk cron job runs as another user). Created on demand.
      PM2_SCHEDULER_NAME: ${{ github.ref == 'refs/heads/main' && 'e11lifeos-scheduler' || 'e11lifeos-scheduler-staging' }}
      PM2_QUEUE_NAME: ${{ github.ref == 'refs/heads/main' && 'e11lifeos-queue' || 'e11lifeos-queue-staging' }}
      # Keeps the WireGuard connection (wireproxy, no root) as configured under Server settings → VPN.
      PM2_VPN_NAME: ${{ github.ref == 'refs/heads/main' && 'e11lifeos-vpn' || 'e11lifeos-vpn-staging' }}
      # Baked into the built JS by Vite — these are the PUBLIC Reverb app key/host/etc.
      # (never the secret), so plain repo Variables are fine, no need for Secrets.
      VITE_REVERB_APP_KEY: ${{ github.ref == 'refs/heads/main' && vars.REVERB_APP_KEY_LIVE || vars.REVERB_APP_KEY_STAGING }}
      VITE_REVERB_HOST: zimmimail.de
      VITE_REVERB_PORT: 443
      VITE_REVERB_SCHEME: https
      VITE_REVERB_PATH: ${{ github.ref == 'refs/heads/main' && '/E11LifeOS' || '/E11LifeOS-staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log deployment info
        run: echo "Deploying to ${{ env.DEPLOY_ENV }} (PM2 app ${{ env.PM2_APP_NAME }}, reverb ${{ env.PM2_REVERB_NAME }})"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config << 'SSHCONFIG'
          Host *
            ConnectTimeout 20
            ServerAliveInterval 15
          SSHCONFIG
          chmod 600 ~/.ssh/config

      - name: Connect to server (with retries)
        run: |
          # The server occasionally resets fresh SSH connections ("kex_exchange_identification:
          # Connection reset by peer"), e.g. after several deploys in a row. Retry with backoff.
          for delay in 10 20 40 60 0; do
            if ssh-keyscan -H "${{ env.SSH_HOST_DEPLOY }}" > /tmp/known_host 2>/dev/null && [ -s /tmp/known_host ] \
              && cat /tmp/known_host >> ~/.ssh/known_hosts \
              && ssh -i ~/.ssh/id_rsa -o BatchMode=yes ${{ secrets.SSH_USER }}@${{ env.SSH_HOST_DEPLOY }} true; then
              echo "SSH connection established"
              exit 0
            fi
            [ "$delay" = 0 ] && break
            echo "SSH not reachable yet, retrying in ${delay}s ..."
            sleep "$delay"
          done
          echo "Could not connect to the server via SSH." >&2
          exit 1

      - name: Create deployment directories
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ env.SSH_HOST_DEPLOY }} << 'DIRSEOF'
          set -e
          mkdir -p ${{ env.APP_PATH_DEPLOY }}/public/build
          # Laravel writable dirs (excluded from rsync) — without these a thrown
          # exception cannot even render an error page ("valid cache path").
          mkdir -p ${{ env.APP_PATH_DEPLOY }}/storage/framework/views
          mkdir -p ${{ env.APP_PATH_DEPLOY }}/storage/framework/cache/data
          mkdir -p ${{ env.APP_PATH_DEPLOY }}/storage/framework/sessions
          mkdir -p ${{ env.APP_PATH_DEPLOY }}/storage/logs
          mkdir -p ${{ env.APP_PATH_DEPLOY }}/storage/app/private
          mkdir -p ${{ env.APP_PATH_DEPLOY }}/storage/app/public
          mkdir -p ${{ env.APP_PATH_DEPLOY }}/bootstrap/cache
          echo "Directories created"
          DIRSEOF

      - name: Deploy application code
        run: |
          # .env is fully SERVER-MANAGED and intentionally never touched by CI —
          # avoids the class of bugs where CI-side templating mangles a real secret.
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/id_rsa" \
            --exclude='storage/' \
            --exclude='vendor/' \
            --exclude='node_modules/' \
            --exclude='.env' \
            --exclude='.git/' \
            ./ \
            ${{ secrets.SSH_USER }}@${{ env.SSH_HOST_DEPLOY }}:${{ env.APP_PATH_DEPLOY }}/

      - name: Run server-side deployment tasks
        run: |
          ssh -i ~/.ssh/id_rsa ${{ secrets.SSH_USER }}@${{ env.SSH_HOST_DEPLOY }} bash -s -- \
            "${{ env.APP_PATH_DEPLOY }}" "${{ env.PM2_APP_NAME }}" "${{ env.PM2_REVERB_NAME }}" "${{ env.PM2_SCHEDULER_NAME }}" "${{ env.PM2_QUEUE_NAME }}" "${{ env.PM2_VPN_NAME }}" "${{ env.APP_PORT }}" "${{ env.REVERB_PORT }}" "${{ env.DEPLOY_ENV }}" << 'EOF'
            set -e
            # Server default `php`/composer resolve to the OS-packaged PHP 8.2 (via
            # /usr/bin/php), but this app needs PHP >=8.3 (Laravel 13) — Plesk also has
            # PHP 8.4 installed under /opt/plesk/php/8.4, just not on the default PATH.
            export PATH="/opt/plesk/php/8.4/bin:/usr/local/bin:/usr/bin:/bin:$PATH"
            APP_PATH="$1"; PM2_APP_NAME="$2"; PM2_REVERB_NAME="$3"; PM2_SCHEDULER_NAME="$4"; PM2_QUEUE_NAME="$5"; PM2_VPN_NAME="$6"; APP_PORT="$7"; REVERB_PORT="$8"; DEPLOY_ENV="$9"

            cd "$APP_PATH"

            if [ ! -f .env ]; then
              echo "ERROR: .env missing at $APP_PATH/.env – run Actions → Deploy E11LifeOS → server-einrichten first (docs/live-einrichten.md)" >&2
              exit 1
            fi

            composer install --no-dev --optimize-autoloader --no-scripts
            php artisan package:discover --ansi

            # Live: back up database and files before migrating (stops the deploy if the backup fails)
            # (skipped on a fresh installation without tables yet).
            if [ "$DEPLOY_ENV" = live ] && php artisan migrate:status > /dev/null 2>&1; then
              php artisan backup:run
            fi

            # Migrations, push keys and – on a fresh installation – the invite code for the first account
            php artisan app:install --no-interaction

            # Clear stale caches (do NOT config:cache — keep reading the live .env)
            php artisan config:clear
            php artisan route:clear
            php artisan view:clear
            php artisan cache:clear

            # App, Reverb, scheduler, queue worker and VPN: restart (new code) or start once.
            # A process still running in another folder (app folder moved) is started anew here.
            PHP_BIN=/opt/plesk/php/8.4/bin/php
            ensure_process() {
              name="$1"; shift
              current_cwd=$(pm2 jlist 2>/dev/null | php -r '$n=$argv[1];foreach(json_decode(stream_get_contents(STDIN),true)?:[] as $p){if(($p["name"]??"")===$n){echo $p["pm2_env"]["pm_cwd"]??"";}}' "$name")
              if [ -n "$current_cwd" ] && [ "$(realpath "$current_cwd" 2>/dev/null)" != "$(realpath "$APP_PATH")" ]; then
                echo "PM2 process $name ran in another folder – starting it in the app folder."
                pm2 delete "$name"
              fi
              if pm2 describe "$name" > /dev/null 2>&1; then
                pm2 restart "$name" --update-env
              else
                pm2 start "$PHP_BIN" --name "$name" --cwd "$APP_PATH" -- "$@"
              fi
            }

            ensure_process "$PM2_APP_NAME" -S "127.0.0.1:$APP_PORT" -t public/
            ensure_process "$PM2_REVERB_NAME" artisan reverb:start "--port=$REVERB_PORT"
            ensure_process "$PM2_SCHEDULER_NAME" artisan schedule:work
            ensure_process "$PM2_QUEUE_NAME" artisan queue:work --queue=admin,default --tries=1 --sleep=3

            # VPN: wireproxy is downloaded once (a failed download must not stop the deploy);
            # the process idles until a WireGuard configuration is saved on the admin page.
            php artisan vpn:install --if-missing || echo "wireproxy could not be installed – VPN stays off."
            ensure_process "$PM2_VPN_NAME" artisan vpn:run

            pm2 save

            echo "Deployment complete (PM2: $PM2_APP_NAME, $PM2_REVERB_NAME)."
          EOF
