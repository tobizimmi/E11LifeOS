name: Mail-Check (einmalig)

# Temporary, read-only: which mail software runs on the server (Plesk/Postfix/Dovecot), which ports
# are open and where the MX records of the app domain point. Changes nothing; removed afterwards.

on:
  push:
    branches: [claude/e11lifeos-second-brain-re5ulu]
    paths: [.github/workflows/mail-check-once.yml]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.SSH_HOST_STAGING }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Read-only mail check
        run: |
          ssh -i ~/.ssh/id_rsa -o BatchMode=yes ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST_STAGING }} bash -s -- "${{ secrets.APP_PATH_STAGING }}" "${{ secrets.APP_PATH_LIVE }}" << 'EOF2'
            S="$1"; L="$2"
            echo "== User / sudo without password?"; id -un; sudo -n true 2>/dev/null && echo "  sudo: yes" || echo "  sudo: no"
            echo "== App domains (APP_URL host)"
            for p in "$S" "$L"; do grep -E '^APP_URL=' "$p/.env" 2>/dev/null | sed -E 's#^APP_URL=["]?https?://([^/"]+).*#  \1#'; done
            echo "== Listening mail ports (25, 465, 587, 143, 993)"
            (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | grep -E ':(25|465|587|143|993)\b' || echo "  none"
            echo "== Mail services"
            for s in postfix dovecot qmail exim4 sendmail psa-spamassassin; do printf "  %-18s %s\n" "$s" "$(systemctl is-active $s 2>/dev/null || echo n/a)"; done
            echo "== Plesk present?"; [ -x /usr/sbin/plesk ] && echo "  yes ($(plesk version 2>/dev/null | head -n1))" || echo "  no"
            echo "== Postfix settings (read-only)"
            command -v postconf >/dev/null && postconf -h myhostname mydestination virtual_mailbox_domains virtual_transport mailbox_command 2>/dev/null | sed 's/^/  /' || echo "  no postconf"
            echo "== MX / A records of the app domains"
            for p in "$S" "$L"; do
              h=$(grep -E '^APP_URL=' "$p/.env" 2>/dev/null | sed -E 's#^APP_URL=["]?https?://([^/":]+).*#\1#')
              [ -z "$h" ] && continue
              d=$(echo "$h" | awk -F. '{print $(NF-1)"."$NF}')
              for n in "$h" "$d"; do echo "  $n MX: $( (dig +short MX "$n" 2>/dev/null || host -t MX "$n" 2>/dev/null) | tr '\n' ' ')"; done
              echo "  $h A: $( (dig +short A "$h" 2>/dev/null) | tr '\n' ' ')"
            done
            echo "== Public IP of the server"; curl -s -4 -m 5 https://api.ipify.org || true; echo
            echo "== PHP imap extension?"; /opt/plesk/php/8.4/bin/php -m 2>/dev/null | grep -i imap || echo "  no"
          EOF2
